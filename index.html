<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shiv Plots">
<meta name="theme-color" content="#1c6b49">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Shiv Residency Plots</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky control bar over a dense plot list; detail opens as a side panel on desktop, a sheet on phone. */
:root{
  --bg:#f2f5f2; --surface:#ffffff; --surface-2:#eaefea; --line:#d6ddd7;
  --fg:#17201b; --muted:#5c6861;
  --accent:#1c6b49; --accent-soft:#e2efe8; --accent-ink:#0f4f34; --on-accent:#ffffff;
  --ok:#1c6b49; --ok-soft:#e2efe8;
  --hold:#8a5a00; --hold-soft:#f8eed6;
  --sold:#9c3327; --sold-soft:#f8e4e1;
  --font-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:10px;
  --shadow:0 1px 2px rgba(20,35,27,.06),0 8px 24px rgba(20,35,27,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10150F; --surface:#181F19; --surface-2:#1f271f; --line:#2c352c;
  --fg:#e7ece7; --muted:#9aa59c;
  --accent:#5cbd8a; --accent-soft:#1c2c23; --accent-ink:#8fd9b2; --on-accent:#0d1510;
  --ok:#5cbd8a; --ok-soft:#1b2a21;
  --hold:#d7a53e; --hold-soft:#2b2415;
  --sold:#e08375; --sold-soft:#2e1c19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10150F; --surface:#181F19; --surface-2:#1f271f; --line:#2c352c;
  --fg:#e7ece7; --muted:#9aa59c;
  --accent:#5cbd8a; --accent-soft:#1c2c23; --accent-ink:#8fd9b2; --on-accent:#0d1510;
  --ok:#5cbd8a; --ok-soft:#1b2a21;
  --hold:#d7a53e; --hold-soft:#2b2415;
  --sold:#e08375; --sold-soft:#2e1c19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-direction:column;gap:10px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--font-display);font-size:1.05rem;letter-spacing:.01em;margin:0;font-weight:700}
.brand .sub{color:var(--muted);font-size:.78rem}
.spacer{flex:1 1 auto}
.iconbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.78rem;font-weight:600;color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--accent)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 13px;font-size:.8rem;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
select{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;font-size:.82rem}

/* ---------- stats ---------- */
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto;padding-block:14px 48px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.stat .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--font-display);font-size:1.3rem;font-weight:700;margin-top:2px}
.stat .v small{font-size:.72rem;color:var(--muted);font-weight:500;font-family:var(--font-body)}

/* ---------- list ---------- */
.listhead{display:none;grid-template-columns:62px 1fr 150px 160px 96px;gap:12px;padding:6px 12px;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
@media(min-width:820px){.listhead{display:grid}}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:10px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;text-align:left;width:100%}
.row:hover{border-color:var(--accent)}
.row.edited{box-shadow:inset 3px 0 0 var(--accent)}
@media(min-width:820px){.row{grid-template-columns:62px 1fr 150px 160px 96px}}
.pno{font-family:var(--font-display);font-weight:700;font-size:1.05rem;display:flex;align-items:baseline;gap:4px}
.who{min-width:0}
.who .area{font-size:.82rem;color:var(--muted)}
.who .nm{font-size:.84rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price{font-family:var(--font-num);font-weight:600;font-size:.95rem;white-space:nowrap}
.price small{display:block;font-size:.68rem;color:var(--muted);font-weight:400}
.hapta{font-family:var(--font-num);font-size:.8rem;color:var(--muted);white-space:nowrap}
@media(max-width:819px){.row{grid-template-columns:54px 1fr auto}.hapta,.listhead{display:none}}
.chip{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.c-available{background:var(--ok-soft);color:var(--ok)}
.c-hold{background:var(--hold-soft);color:var(--hold)}
.c-booked{background:var(--sold-soft);color:var(--sold)}
.flagdot{color:var(--hold);font-weight:700;font-size:.8rem}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.more{margin:14px auto 0;display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 20px;font-weight:600;color:var(--accent)}

/* ---------- panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,18,13,.45);z-index:50;display:flex;justify-content:flex-end}
.panel{background:var(--surface);width:min(470px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(24px + env(safe-area-inset-bottom,0px))}
@media(max-width:600px){.scrim{align-items:flex-end}.panel{width:100%;height:92%;border-radius:16px 16px 0 0}}
.phead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:2}
.phead h2{font-family:var(--font-display);margin:0;font-size:1.25rem}
.sec{border-bottom:1px solid var(--line);padding-block:14px}
.sec:last-child{border-bottom:0}
.sec h3{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:700}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.88rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right}
.scheme{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;margin-bottom:8px}
.scheme .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.scheme .nm{font-weight:700;font-size:.9rem;font-family:var(--font-display)}
.scheme .tot{font-family:var(--font-num);font-weight:700;font-size:1rem}
.scheme.active{border-color:var(--accent);background:var(--accent-soft)}
.srow{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:.82rem}
.srow dt{color:var(--muted)}
.srow dd{margin:0;font-family:var(--font-num);text-align:right}
.srow .bank{color:var(--accent-ink);font-weight:700}
.chq{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.88rem;width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-block:14px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius);padding:10px 14px;font-weight:600;font-size:.86rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{color:var(--muted)}
.warnbox{background:var(--hold-soft);color:var(--hold);border-radius:8px;padding:8px 10px;font-size:.8rem;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.84rem;font-weight:600;z-index:80;max-width:90vw;text-align:center}
textarea{min-height:140px;font-family:var(--font-num);font-size:.76rem;resize:vertical}
.note{font-size:.78rem;color:var(--muted)}
@media(prefers-reduced-motion:no-preference){.panel{animation:slide .18s ease-out}@keyframes slide{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>

</div>

const EDIT_KEY = 'shiv_residency_edits_v2';
const PREF_KEY = 'shiv_residency_prefs_v2';
const FIELDS = ['cheque','p18','d18','h18','p50','d50','h50','status','name','village','mobile',
                'date','receipt','scheme','discount','remark','sqm','vaar','sqft','note'];

function store(k, v){ try{ v===undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }

let edits = load(EDIT_KEY, {});
let prefs = load(PREF_KEY, {scheme:'s18', theme:null, title:'', sub:''});
let state = {q:'', scheme: prefs.scheme || 's18', status:'all', size:'all', sort:'no', limit:60};

if(prefs.theme) document.documentElement.setAttribute('data-theme', prefs.theme);

const plot = no => Object.assign({}, RAW[no-1], edits[no] || {});
const ALL = () => RAW.map(p => plot(p.no));
const isEdited = no => !!(edits[no] && Object.keys(edits[no]).length);

/* ---------- formatting ---------- */
const inr = n => '₹' + Number(n||0).toLocaleString('en-IN');
function lakh(n){
  n = Number(n||0);
  if(n >= 10000000) return (n/10000000).toFixed(2).replace(/\.00$/,'') + ' Cr';
  return (n/100000).toFixed(2).replace(/\.00$/,'') + ' L';
}
const num = v => Math.round(Number(String(v).replace(/[^0-9.-]/g,'')) || 0);
const dec = v => Math.round((Number(String(v).replace(/[^0-9.-]/g,'')) || 0) * 100) / 100;
function dmy(iso){
  if(!iso) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  return m ? m[3] + '/' + m[2] + '/' + m[1].slice(2) : iso;
}

const price = (p, s) => s==='s50' ? p.p50 : p.p18;
const down  = (p, s) => s==='s50' ? p.d50 : p.d18;
const inst  = (p, s) => s==='s50' ? p.h50 : p.h18;
const count = s => s==='s50' ? 50 : 18;
const label = s => s==='s50' ? '50 months' : '18 months';
const payLine = (p, s) => inr(down(p,s)) + ' + ' + inr(inst(p,s)) + ' × ' + count(s);
/* the cheque (bank) portion is the same registered amount under either scheme */
const balance = (p, s) => Math.max(0, price(p,s) - p.cheque);
const netPrice = (p, s) => Math.max(0, price(p,s) - num(p.discount||0));

/* ---------- filtering ---------- */
function filtered(){
  const q = state.q.trim().toLowerCase();
  const s = state.scheme;
  let out = ALL().filter(p => {
    if(state.status !== 'all' && p.status !== state.status) return false;
    if(state.size === '560' && Math.abs(p.sqft-560.49) > 0.5) return false;
    if(state.size === '800' && Math.abs(p.sqft-800.76) > 0.5) return false;
    if(state.size === 'other' && (Math.abs(p.sqft-560.49) < 0.5 || Math.abs(p.sqft-800.76) < 0.5)) return false;
    if(!q) return true;
    if(String(p.no) === q) return true;
    return (p.no + ' ' + p.name + ' ' + p.village + ' ' + p.mobile + ' ' + (p.receipt||'') + ' ' + (p.remark||'')).toLowerCase().includes(q);
  });
  const by = {
    no:(a,b)=>a.no-b.no,
    plow:(a,b)=>price(a,s)-price(b,s)||a.no-b.no,
    phigh:(a,b)=>price(b,s)-price(a,s)||a.no-b.no,
    alow:(a,b)=>a.sqft-b.sqft||a.no-b.no,
    ahigh:(a,b)=>b.sqft-a.sqft||a.no-b.no,
    recent:(a,b)=>String(b.date||'').localeCompare(String(a.date||''))||a.no-b.no
  }[state.sort];
  return out.sort(by);
}

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- render ---------- */
function render(){
  const rows = filtered(), s = state.scheme;
  const shown = rows.slice(0, state.limit);
  const list = document.getElementById('list');
  list.innerHTML = '';
  const frag = document.createDocumentFragment();
  shown.forEach(p => {
    const b = document.createElement('button');
    b.className = 'row' + (isEdited(p.no) ? ' edited' : '');
    b.dataset.no = p.no;
    const flag = (p.note || p.verify) ? ' <span class="flagdot" title="Needs checking">&#9888;</span>' : '';
    const sub = p.status === 'booked'
      ? (p.date ? dmy(p.date) : '') + (p.receipt ? ' · pavti ' + p.receipt : '') + (p.village ? ' · ' + esc(p.village) : '')
      : p.sqft.toFixed(0) + ' sq.ft · ' + p.sqm.toFixed(2) + ' sq.mt';
    b.innerHTML =
      '<div class="pno">' + p.no + flag + '</div>' +
      '<div class="who">' +
        '<div class="nm">' + (p.name ? esc(p.name) : '<span style="color:var(--muted);font-weight:500">Open plot &middot; ' + p.sqft.toFixed(0) + ' sq.ft</span>') + '</div>' +
        '<div class="area num">' + sub + '</div>' +
      '</div>' +
      '<div class="price">' + inr(price(p,s)) + '<small>cheque ' + inr(p.cheque) + '</small></div>' +
      '<div class="hapta">' + payLine(p,s) + '</div>' +
      '<div><span class="chip c-' + p.status + '">' + (p.status==='booked'?'sold':p.status) + '</span></div>';
    frag.appendChild(b);
  });
  list.appendChild(frag);
  if(!rows.length) list.innerHTML = '<p class="empty">No plot matches this search.</p>';
  const more = document.getElementById('more');
  more.hidden = rows.length <= state.limit;
  more.textContent = 'Show more (' + (rows.length - state.limit) + ' left)';
  document.getElementById('h-price').textContent = label(s) + ' price';
  renderStats(rows);
  document.getElementById('foot').textContent =
    'Showing ' + shown.length + ' of ' + rows.length + ' plots. Changes save on this device only — use Backup to move them to your other device.';
}

function renderStats(rows){
  const s = state.scheme, all = ALL();
  const avail = all.filter(p => p.status === 'available');
  const hold = all.filter(p => p.status === 'hold');
  const sold = all.filter(p => p.status === 'booked');
  const openValue = avail.reduce((t,p) => t + price(p,s), 0);
  const soldCheque = sold.reduce((t,p) => t + p.cheque, 0);
  const cards = [
    ['Available', avail.length, 'of 400 plots'],
    ['Sold', sold.length, 'in the register'],
    ['On hold', hold.length, 'blocked'],
    ['Open stock', lakh(openValue), 'at ' + label(s)],
    ['Sold by cheque', lakh(soldCheque), 'bank amount']
  ];
  document.getElementById('stats').innerHTML = cards.map(c =>
    '<div class="stat"><div class="k">' + c[0] + '</div><div class="v">' + c[1] + ' <small>' + c[2] + '</small></div></div>').join('');
}

/* ---------- detail panel ---------- */
function openPlot(no){
  const p = plot(no), s = state.scheme;
  const t18 = p.d18 + p.h18 * 18, t50 = p.d50 + p.h50 * 50;
  const mism = [];
  if(Math.abs(t18 - p.p18) > 2000) mism.push('18 months: ' + inr(p.d18) + ' + ' + inr(p.h18) + ' × 18 = ' + inr(t18) + ', but the price is ' + inr(p.p18));
  if(Math.abs(t50 - p.p50) > 2000) mism.push('50 months: ' + inr(p.d50) + ' + ' + inr(p.h50) + ' × 50 = ' + inr(t50) + ', but the price is ' + inr(p.p50));

  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML =
  '<div class="panel" role="dialog" aria-label="Plot ' + no + '">' +
    '<div class="phead"><h2>Plot ' + no + '</h2><span class="chip c-' + p.status + '">' + (p.status==='booked'?'sold':p.status) + '</span>' +
      (isEdited(no) ? '<span class="chip c-hold">edited</span>' : '') +
      '<span style="flex:1"></span><button class="iconbtn" data-act="close">Close</button></div>' +

    '<div class="sec"><h3>Plot size</h3><div class="fields">' +
      field('sqft','Net area (sq.ft)','decimal',p.sqft) +
      field('sqm','Square metre','decimal',p.sqm) +
      field('vaar','Vaar (varadi jagya)','decimal',p.vaar) +
    '</div></div>' +

    '<div class="sec"><h3>Payment schemes</h3>' +
      schemeCard(p, 's18', s==='s18') +
      schemeCard(p, 's50', s==='s50') +
      (mism.length ? '<div class="warnbox"><b>Sheet mismatch:</b><br>' + mism.join('<br>') + '</div>' : '') +
      (p.note ? '<div class="warnbox"><b>Note:</b><br>' + esc(p.note) + '</div>' : '') +
      (p.verify ? '<div class="warnbox"><b>Check this entry:</b> the name or village was hard to read in the register photo.</div>' : '') +
    '</div>' +

    '<div class="sec"><h3>Booking</h3><div class="fields">' +
      field('status','Status','select',p.status) +
      field('scheme','Scheme taken','scheme',p.scheme||'') +
      field('date','Booking date','date',p.date||'') +
      field('receipt','Pavti (receipt) no','text',p.receipt||'') +
      field('name','Customer name','text',p.name) +
      field('village','Village','text',p.village) +
      field('mobile','Mobile','tel',p.mobile) +
      field('discount','Discount (₹)','number',p.discount||'') +
      field('remark','Remark','textarea',p.remark||'') +
    '</div>' +
      '<dl class="kv" style="margin-top:10px"><dt>Net price after discount (' + label(s) + ')</dt><dd id="netout">' + inr(netPrice(p,s)) + '</dd></dl>' +
    '</div>' +

    '<div class="sec"><h3>Amounts (editable)</h3><div class="fields">' +
      field('cheque','Cheque / bank amount','number',p.cheque) +
      field('p18','18-month price','number',p.p18) +
      field('d18','18-month down','number',p.d18) +
      field('h18','18-month instalment','number',p.h18) +
      field('p50','50-month price','number',p.p50) +
      field('d50','50-month down','number',p.d50) +
      field('h50','50-month instalment','number',p.h50) +
      field('note','Note / warning shown on this plot','textarea',p.note||'') +
    '</div>' +
      '<p class="note" style="margin:8px 0 0">Clear the note to remove the ⚠ mark from this plot.</p></div>' +

    '<div class="actions">' +
      '<button class="btn primary" data-act="save">Save changes</button>' +
      '<button class="btn" data-act="copy">Copy for WhatsApp</button>' +
      (isEdited(no) ? '<button class="btn ghost" data-act="reset">Reset to price list</button>' : '') +
    '</div>' +
  '</div>';

  scrim.addEventListener('click', e => {
    if(e.target === scrim) return closePanel();
    const act = e.target.closest('[data-act]');
    if(!act) return;
    const a = act.dataset.act;
    if(a === 'close') closePanel();
    if(a === 'save') savePanel(no, scrim);
    if(a === 'copy') copySummary(no);
    if(a === 'reset'){ delete edits[no]; store(EDIT_KEY, edits); closePanel(); render(); toast('Plot ' + no + ' reset to the price list'); }
  });
  scrim.addEventListener('input', () => {
    const merged = Object.assign({}, p, readPanel(scrim));
    const out = scrim.querySelector('#netout');
    if(out) out.textContent = inr(netPrice(merged, state.scheme));
  });
  document.body.appendChild(scrim);
  document.body.style.overflow = 'hidden';
}

function schemeCard(p, s, active){
  return '<div class="scheme' + (active?' active':'') + '">' +
    '<div class="top"><span class="nm">' + label(s) + '</span>' +
      '<span class="tot">' + inr(price(p,s)) + ' <small style="color:var(--muted);font-weight:400">(' + lakh(price(p,s)) + ')</small></span></div>' +
    '<dl class="srow">' +
      '<dt>Down payment</dt><dd>' + inr(down(p,s)) + '</dd>' +
      '<dt>Hapta</dt><dd>' + inr(inst(p,s)) + ' × ' + count(s) + '</dd>' +
    '</dl>' +
    '<dl class="srow chq">' +
      '<dt class="bank">By cheque (bank)</dt><dd class="bank">' + inr(p.cheque) + '</dd>' +
      '<dt>Balance</dt><dd>' + inr(balance(p,s)) + '</dd>' +
    '</dl></div>';
}

function field(key, lbl, type, val){
  const id = 'f-' + key;
  if(type === 'select' || type === 'scheme'){
    const opts = type === 'select'
      ? [['available','available'],['hold','on hold'],['booked','sold']]
      : [['','not set'],['18','18 months'],['50','50 months'],['full','full payment']];
    return '<div class="f"><label for="' + id + '">' + lbl + '</label><select id="' + id + '" data-key="' + key + '">' +
      opts.map(o => '<option value="' + o[0] + '"' + (o[0]===String(val)?' selected':'') + '>' + o[1] + '</option>').join('') +
      '</select></div>';
  }
  if(type === 'textarea')
    return '<div class="f full"><label for="' + id + '">' + lbl + '</label><textarea id="' + id + '" data-key="' + key + '" style="min-height:62px">' + esc(val) + '</textarea></div>';
  const t = type === 'decimal' ? 'number' : type;
  const step = type === 'decimal' ? ' step="0.01"' : '';
  return '<div class="f"><label for="' + id + '">' + lbl + '</label><input id="' + id + '" data-key="' + key + '" type="' + t + '"' + step + ' value="' + esc(val) + '"></div>';
}

function readPanel(scrim){
  const vals = {};
  scrim.querySelectorAll('[data-key]').forEach(el => {
    const k = el.dataset.key;
    if(DECIMAL.includes(k)) vals[k] = el.value === '' ? 0 : dec(el.value);
    else if(NUMERIC.includes(k)) vals[k] = el.value === '' ? 0 : num(el.value);
    else vals[k] = el.value.trim();
  });
  return vals;
}

function savePanel(no, scrim){
  const base = RAW[no-1], vals = readPanel(scrim);
  if(vals.name && vals.status === 'available') vals.status = 'booked';
  const diff = {};
  if(base.verify) diff.verify = false;   /* you have reviewed it, so drop the check mark */
  FIELDS.forEach(k => {
    const b = base[k] === undefined ? (k==='discount' ? 0 : '') : base[k];
    if(String(vals[k]) !== String(b)) diff[k] = vals[k];
  });
  if(Object.keys(diff).length) edits[no] = diff; else delete edits[no];
  store(EDIT_KEY, edits);
  closePanel(); render();
  toast('Plot ' + no + ' saved on this device');
}

function closePanel(){
  const s = document.querySelector('.scrim');
  if(s) s.remove();
  document.body.style.overflow = '';
}

function copySummary(no){
  const p = plot(no);
  const txt = [
    'SHIV RESIDENCY, BODELI',
    'Plot No. ' + p.no,
    'Area: ' + p.sqft.toFixed(0) + ' sq.ft (' + p.sqm.toFixed(2) + ' sq.mt)',
    '',
    '18 MONTHS: ' + inr(p.p18),
    '  Down ' + inr(p.d18) + ' + hapta ' + inr(p.h18) + ' x 18',
    '  By cheque ' + inr(p.cheque) + ', balance ' + inr(balance(p,'s18')),
    '',
    '50 MONTHS: ' + inr(p.p50),
    '  Down ' + inr(p.d50) + ' + hapta ' + inr(p.h50) + ' x 50',
    '  By cheque ' + inr(p.cheque) + ', balance ' + inr(balance(p,'s50')),
    '',
    p.status === 'booked'
      ? 'Status: SOLD' + (p.name ? ' - ' + p.name : '') + (p.date ? ' (' + dmy(p.date) + ')' : '')
      : 'Status: ' + p.status.toUpperCase()
  ].join('\n');
  copy(txt, 'Plot ' + no + ' details copied');
}

function copy(text, msg){
  try{ navigator.clipboard.writeText(text).then(() => toast(msg), () => fallbackCopy(text)); }
  catch(e){ fallbackCopy(text); }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Copied'); }catch(e){ toast('Press and hold to copy'); }
  ta.remove();
}

let toastT;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastT);
  toastT = setTimeout(() => el.remove(), 2600);
}

/* ---------- edit app (name, heading, bulk status) ---------- */
function applyPrefs(){
  if(prefs.title) document.getElementById('app-title').textContent = prefs.title;
  if(prefs.sub) document.getElementById('app-sub').textContent = prefs.sub;
}

function openSettings(){
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML =
  '<div class="panel" role="dialog" aria-label="Edit app">' +
    '<div class="phead"><h2>Edit app</h2><span style="flex:1"></span><button class="iconbtn" data-act="close">Close</button></div>' +
    '<div class="sec"><h3>Heading</h3><div class="fields">' +
      '<div class="f full"><label for="s-title">App name</label><input id="s-title" type="text" value="' +
        esc(prefs.title || 'Shiv Residency') + '"></div>' +
      '<div class="f full"><label for="s-sub">Line under the name</label><input id="s-sub" type="text" value="' +
        esc(prefs.sub || 'Bodeli · 400 plots') + '"></div>' +
    '</div><div class="actions"><button class="btn primary" data-act="savehead">Save heading</button></div></div>' +

    '<div class="sec"><h3>Change many plots at once</h3>' +
      '<p class="note">Type plot numbers separated by commas, for example 12, 45, 301-305.</p>' +
      '<div class="fields">' +
        '<div class="f full"><label for="s-nos">Plot numbers</label><input id="s-nos" type="text" placeholder="e.g. 12, 45, 301-305"></div>' +
        '<div class="f"><label for="s-status">Set status to</label><select id="s-status">' +
          '<option value="available">available</option><option value="hold">on hold</option><option value="booked">sold</option>' +
        '</select></div>' +
      '</div>' +
      '<div class="actions"><button class="btn primary" data-act="bulk">Apply to these plots</button></div></div>' +

    '<div class="sec"><h3>Raise or lower prices</h3>' +
      '<p class="note">Changes the 18-month and 50-month price, down payment and hapta together. Leave the plot numbers empty to change every plot.</p>' +
      '<div class="fields">' +
        '<div class="f full"><label for="s-pnos">Plot numbers (optional)</label><input id="s-pnos" type="text" placeholder="blank = all 400"></div>' +
        '<div class="f"><label for="s-pct">Change by %</label><input id="s-pct" type="number" step="0.5" placeholder="e.g. 5 or -5"></div>' +
      '</div>' +
      '<div class="actions"><button class="btn" data-act="price">Apply price change</button></div>' +
      '<p class="note">Rounded to the nearest ₹100. The cheque amount is left as it is.</p></div>' +
  '</div>';

  scrim.addEventListener('click', e => {
    if(e.target === scrim) return closePanel();
    const act = e.target.closest('[data-act]'); if(!act) return;
    const a = act.dataset.act;
    if(a === 'close') return closePanel();
    if(a === 'savehead'){
      prefs.title = scrim.querySelector('#s-title').value.trim();
      prefs.sub = scrim.querySelector('#s-sub').value.trim();
      store(PREF_KEY, prefs); applyPrefs(); closePanel(); toast('Heading saved');
    }
    if(a === 'bulk'){
      const nos = parseNos(scrim.querySelector('#s-nos').value);
      if(!nos.length) return toast('Type at least one plot number');
      const st = scrim.querySelector('#s-status').value;
      nos.forEach(no => { edits[no] = Object.assign({}, edits[no], {status: st}); });
      store(EDIT_KEY, edits); closePanel(); render();
      toast(nos.length + ' plot' + (nos.length===1?'':'s') + ' set to ' + st);
    }
    if(a === 'price'){
      const pct = Number(scrim.querySelector('#s-pct').value);
      if(!pct) return toast('Type a percentage, for example 5 or -5');
      let nos = parseNos(scrim.querySelector('#s-pnos').value);
      if(!nos.length) nos = RAW.map(p => p.no);
      const f = 1 + pct / 100;
      const r100 = v => Math.round(v * f / 100) * 100;
      nos.forEach(no => {
        const cur = plot(no);
        edits[no] = Object.assign({}, edits[no], {
          p18: r100(cur.p18), d18: r100(cur.d18), h18: r100(cur.h18),
          p50: r100(cur.p50), d50: r100(cur.d50), h50: r100(cur.h50)
        });
      });
      store(EDIT_KEY, edits); closePanel(); render();
      toast(nos.length + ' plots changed by ' + pct + '%');
    }
  });
  document.body.appendChild(scrim);
  document.body.style.overflow = 'hidden';
}

function parseNos(text){
  const out = new Set();
  String(text || '').split(',').forEach(part => {
    part = part.trim();
    if(!part) return;
    const r = /^(\d{1,3})\s*-\s*(\d{1,3})$/.exec(part);
    if(r){
      const a = Math.min(+r[1], +r[2]), b = Math.max(+r[1], +r[2]);
      for(let i = a; i <= b; i++) if(i >= 1 && i <= 400) out.add(i);
    } else if(/^\d{1,3}$/.test(part)){
      const n = +part; if(n >= 1 && n <= 400) out.add(n);
    }
  });
  return [...out];
}

/* ---------- backup ---------- */
function openBackup(){
  const n = Object.keys(edits).length;
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML =
  '<div class="panel" role="dialog" aria-label="Backup">' +
    '<div class="phead"><h2>Backup</h2><span style="flex:1"></span><button class="iconbtn" data-act="close">Close</button></div>' +
    '<div class="sec"><h3>Your changes</h3>' +
      '<p class="note">' + n + ' plot' + (n===1?'':'s') + ' changed on this device. Copy this text and paste it on your other device to carry the same changes across.</p>' +
      '<textarea id="bk" spellcheck="false">' + esc(JSON.stringify(edits)) + '</textarea>' +
      '<div class="actions"><button class="btn primary" data-act="copybk">Copy changes</button>' +
      '<button class="btn" data-act="loadbk">Load pasted changes</button>' +
      '<button class="btn" data-act="csv">Copy full list as CSV</button></div>' +
      '<p class="note">CSV opens in Google Sheets or Excel: paste into cell A1, then Data &rarr; Split text to columns.</p>' +
    '</div>' +
    '<div class="sec"><h3>Clear</h3><div class="actions"><button class="btn ghost" data-act="clear">Remove all my changes</button></div>' +
      '<p class="note">The 400 plots always stay in the app. Only your own edits are removed.</p></div>' +
  '</div>';
  scrim.addEventListener('click', e => {
    if(e.target === scrim) return closePanel();
    const act = e.target.closest('[data-act]'); if(!act) return;
    const a = act.dataset.act;
    if(a === 'close') closePanel();
    if(a === 'copybk') copy(JSON.stringify(edits), 'Changes copied');
    if(a === 'csv') copy(csv(), 'Full list copied as CSV');
    if(a === 'loadbk'){
      try{
        const obj = JSON.parse(scrim.querySelector('#bk').value);
        if(obj && typeof obj === 'object'){
          Object.keys(obj).forEach(k => { edits[k] = obj[k]; });
          store(EDIT_KEY, edits); closePanel(); render(); toast('Changes loaded');
        }
      }catch(e){ toast('That text is not a valid backup'); }
    }
    if(a === 'clear'){
      if(act.dataset.sure){ edits = {}; store(EDIT_KEY, edits); closePanel(); render(); toast('All your changes removed'); }
      else { act.dataset.sure = '1'; act.textContent = 'Tap again to confirm'; }
    }
  });
  document.body.appendChild(scrim);
  document.body.style.overflow = 'hidden';
}

function csv(){
  const head = ['Plot','Sq.Mt','Vaar','Sq.Ft','Cheque','18M Price','18M Down','18M Hapta',
                '50M Price','50M Down','50M Hapta','Status','Scheme','Date','Pavti','Name','Village','Mobile','Discount','Remark'];
  const q = s => { s = String(s||''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const lines = [head.join(',')];
  ALL().forEach(p => lines.push([p.no,p.sqm,p.vaar,p.sqft,p.cheque,p.p18,p.d18,p.h18,p.p50,p.d50,p.h50,
    p.status,p.scheme||'',p.date||'',p.receipt||'',q(p.name),q(p.village),p.mobile,p.discount||0,q(p.remark||p.note||'')].join(',')));
  return lines.join('\n');
}

/* ---------- events ---------- */
document.getElementById('list').addEventListener('click', e => {
  const row = e.target.closest('.row');
  if(row) openPlot(Number(row.dataset.no));
});
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; state.limit = 60; render(); });
document.querySelectorAll('[data-scheme]').forEach(b => {
  b.setAttribute('aria-pressed', String(b.dataset.scheme === state.scheme));
  b.addEventListener('click', () => {
    state.scheme = b.dataset.scheme;
    document.querySelectorAll('[data-scheme]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    prefs.scheme = state.scheme; store(PREF_KEY, prefs);
    render();
  });
});
document.getElementById('f-status').addEventListener('change', e => { state.status = e.target.value; state.limit = 60; render(); });
document.getElementById('f-size').addEventListener('change', e => { state.size = e.target.value; state.limit = 60; render(); });
document.getElementById('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
document.getElementById('more').addEventListener('click', () => { state.limit += 100; render(); });
document.getElementById('btn-backup').addEventListener('click', openBackup);
document.getElementById('btn-settings').addEventListener('click', openSettings);
document.getElementById('btn-theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  prefs.theme = next; store(PREF_KEY, prefs);
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') closePanel(); });

applyPrefs();
render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        w && w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller) {
            var t = document.createElement('div');
            t.className = 'toast';
            t.textContent = 'New version ready - close and reopen the app';
            document.body.appendChild(t);
          }
        });
      });
    }).catch(function () {});
  });
}
</script>
